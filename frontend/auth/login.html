<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/auth/style.css" />
    <script src="login.js" defer></script>
    <link rel="icon" type="image/png" href="http://localhost:8000/images/4Dudes.png" />
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/headerfooter.css" />
  </head>
  <body>
    <header class="header">
      <div class="Logo">
        <a href="/index.html">
          <img src="http://localhost:8000/images/4Dudes-Photoroom.png" alt="Logo" sizes="50" />
          <h1>4Dudes</h1>
        </a>
      </div>
      <div class="nav">
        <a href="/auth/login.html">
          <input type="button" value="Login" class="but" />
        </a>
        <a href="/views/account.html">
          <input type="button" value="ACCOUNT" class="but" />
        </a>
        <a href="/views/cart.html">
          <input type="button" value="EINKAUFSWAGEN" class="but" />
        </a>
      </div>
    </header>

    <div class="login-wrapper">
      <form onsubmit="login(event)" class="login-form">
        <h2>Login</h2>
        <div class="input-group">
          <input
            type="text"
            name="loginUsername"
            id="login-username"
            required
          />
          <label for="loginUser">User Name</label>
        </div>
        <div class="input-group">
          <input
            type="password"
            name="loginPassword"
            id="login-password"
            required
          />
          <label for="loginPassword">Password</label>
        </div>
        <input type="submit" value="Login" class="submit-btn" />
        <a href="/auth/register.html">
          <input type="button" value="Register" class="submit-btn" />
        </a>
        <p id="result"></p>
      </form>
    </div>

    <footer class="footer">
      <div class="items3">
        <img
          class="left"
          src="http://localhost:8000/images/4Dudes-Photoroom.png"
          alt="Logo"
          sizes="50"
        />
      </div>
      <div class="items3">
        <p class="center">
          <a href="/views/imprint.html"> Impressum </a>
          <a href="/views/agb.html"> AGB's </a>
          <a href="/views/datenschutz.html"> Datenschutz </a>
        </p>
      </div>
      <div class="items3">
        <p class="right">&copy; 2026 4Dudes. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
